  <desc id="desc">Recognize the condition, take a safe action, then verify the outcome.</desc>
  <rect width="900" height="300" rx="26" fill="#f3f0e7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="160" cy="150" r="78" fill="#e3ece7" stroke="#527364" stroke-width="4"/>
    <circle cx="450" cy="150" r="78" fill="#f6e8d2" stroke="#c9822d" stroke-width="4"/>
