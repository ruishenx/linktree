<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">A compact systems feedback loop</title>
  <desc id="desc">Signal flows to decision, then action, then outcome, and returns to signal.</desc>
  <rect width="960" height="420" rx="28" fill="#f3f0e7"/>
  <g fill="#ffffff" stroke="#527364" stroke-width="3">
    <rect x="70" y="150" width="170" height="100" rx="18"/>
    <rect x="285" y="150" width="170" height="100" rx="18"/>
    <rect x="505" y="150" width="170" height="100" rx="18"/>
    <rect x="720" y="150" width="170" height="100" rx="18"/>
  </g>
  <g fill="#173f35" font-family="Arial, sans-serif" font-size="27" text-anchor="middle">
    <text x="155" y="210">Signal</text>
    <text x="370" y="210">Decision</text>
    <text x="590" y="210">Action</text>
    <text x="805" y="210">Outcome</text>
  </g>
  <g fill="none" stroke="#c9822d" stroke-width="5" stroke-linecap="round">
    <path d="M240 200h35"/>
    <path d="M455 200h40"/>
    <path d="M675 200h35"/>
    <path d="M805 270c0 105-650 105-650 0"/>
  </g>
  <g fill="#c9822d">
    <path d="m274 200-15-9v18Z"/>
    <path d="m494 200-15-9v18Z"/>
    <path d="m709 200-15-9v18Z"/>
    <path d="m155 270-9 15h18Z"/>
  </g>
</svg>
