<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Gallery</title>
  <link href="https://fonts.googleapis.com/css?family=Alegreya:900|Cinzel:900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="gallary" aria-label="Art gallery">
    <div class="text">
      <h1>Gallery</h1>
      <p>art<span>.</span></p>
    </div>

    <!-- Clockwise order, beginning at the upper-left corner. -->
    <figure class="image image1">
      <img src="./assets/galaxy_sunflower.jpg" alt="Galaxy Sunflower">
    </figure>
    <figure class="image image2">
      <img src="./assets/couple.png" alt="Couple">
    </figure>
    <figure class="image image3">
      <img src="./assets/cross_paths.png" alt="Cross paths">
    </figure>
    <figure class="image image4">
      <img src="./assets/fake_it_till_you_make_it.png" alt="Fake It Till You Make It">
    </figure>
    <figure class="image image5">
      <img src="./assets/reflection.png" alt="Reflection">
    </figure>
    <figure class="image image6">
      <img src="./assets/five.png" alt="Five">
    </figure>
    <figure class="image image7">
      <img src="./assets/ex_machina_2015.png" alt="Ex Machina 2015">
    </figure>
    <figure class="image image8">
      <img src="./assets/cyberpunk.jpeg" alt="Cyberpunk">
    </figure>
    <figure class="image image9">
      <img src="./assets/twins.png" alt="Twins">
    </figure>
    <figure class="image image10">
      <img src="./assets/virtual.png" alt="Virtual">
    </figure>
    <figure class="image image11">
      <img src="./assets/three.png" alt="Three">
    </figure>
    <figure class="image image12">
      <img src="./assets/inspiration_in_dreams.png" alt="Inspiration in Dreams">
    </figure>
  </main>

  <script src="./script.js"></script>
</body>

</html>
