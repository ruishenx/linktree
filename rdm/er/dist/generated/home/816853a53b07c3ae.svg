<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Final violet symmetric logo</title>
  <desc id="desc">A fully symmetric logo in violet, with continuous horizontal dash spacing and exact bilateral symmetry both horizontally and vertically.</desc>
  <defs>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D2D2D"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8F00FF"/>
      <stop offset="100%" stop-color="#6C00C4"/>
    </linearGradient>
  </defs>

  <!-- Verified symmetry:
       1) left-right mirror symmetry about x = 500
       2) top-bottom mirror symmetry about y = 350
       3) small dash length = 20
       4) dash gap = 12.36 = 0.618 * 20
       5) center circle radius = 20
       6) nearest dash distance from center = 60 = 3 * 20
       7) horizontal dashes are continuous, not split into 3/3/3 groups
       8) terminal perpendicular end-caps connect directly to the dashed axes
  -->

  <g fill="none" stroke="url(#darkGrad)" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 338.56 170.00 H 300.56 V 530.00 H 338.56"/>
    <path d="M 661.44 170.00 H 699.44 V 530.00 H 661.44"/>
  </g>

  <g stroke="url(#darkGrad)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 420.00 245.00 L 388.00 245.00 L 388.00 277.00"/>
    <path d="M 580.00 245.00 L 612.00 245.00 L 612.00 277.00"/>
    <path d="M 388.00 423.00 L 388.00 455.00 L 420.00 455.00"/>
    <path d="M 612.00 423.00 L 612.00 455.00 L 580.00 455.00"/>
  </g>

